name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the older run. Matters more than
# usual here: the Mac is a single runner, so stale queued iOS jobs would
# block the current one behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Secret scan first — cheap, and a leak makes everything else moot.
  # Complements GitHub push protection at the platform layer.
  # ---------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history for a meaningful scan
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # Everything that can run on Linux runs on Linux. Fast and cheap.
  # ---------------------------------------------------------------
  web:
    name: Web (typecheck, lint, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  appcore:
    name: AppCore (Swift on Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      # Includes swift-snapshot-testing .dump/.json assertions, which
      # run fine on Linux. Only image snapshots need a simulator.
      - name: Check for AppCore
        id: appcore-check
        run: |
          if [[ -d "ios/Packages/AppCore" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ios/Packages/AppCore not found — skipping AppCore job"
          fi
      - name: Build and test
        if: steps.appcore-check.outputs.exists == 'true'
        working-directory: ios/Packages/AppCore
        run: |
          swift build
          swift test

  e2e:
    name: E2E + visual regression
    runs-on: ubuntu-latest
    needs: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Pin the browser build. Screenshot baselines are sensitive to
      # renderer version — an unpinned upgrade produces diffs that look
      # like regressions but aren't.
      - run: pnpm exec playwright install --with-deps chromium

      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed

      # Production build. Baselines must be captured against the same
      # thing CI runs, or every screenshot assertion drifts.
      - run: pnpm build
      - run: pnpm exec playwright test

      # The report contains the actual/expected/diff triptych — this is
      # how a visual failure gets reviewed on a phone.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------
  # Mac-only work, on the self-hosted runner.
  # ---------------------------------------------------------------
  ios:
    name: iOS (build + test)
    runs-on: [self-hosted, macOS, xcode]
    timeout-minutes: 45
    steps:
      # Explicit ref: the self-hosted runner's workspace persists between
      # jobs, so never assume a clean or correct checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Check for iOS project
        id: ios-check
        run: |
          if [[ -d "ios" ]] && find ios -name "*.xcodeproj" -o -name "*.xcworkspace" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Xcode project found in ios/ — skipping iOS build"
          fi

      - name: Environment
        if: steps.ios-check.outputs.exists == 'true'
        run: |
          export PATH=/Applications/Xcode.app/Contents/Developer/usr/bin:$PATH
          xcodebuild -version
          xcrun simctl list devices available | head -5

      # `set -o pipefail` is load-bearing: without it the exit status
      # comes from xcpretty, not xcodebuild, and every build "passes".
      - name: Build and test
        if: steps.ios-check.outputs.exists == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project ValgateiOS.xcodeproj \
            -scheme ValgateiOS \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            | xcpretty || true

      # Contains failed image-snapshot attachments alongside the logs.
      - uses: actions/upload-artifact@v4
        if: failure() && steps.ios-check.outputs.exists == 'true'
        with:
          name: xcresult
          path: ios/TestResults.xcresult
          retention-days: 7
