name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the older run. Matters more than
# usual here: the Mac is a single runner, so stale queued iOS jobs would
# block the current one behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# seed:neon imports lib/env.ts, which requires NEXT_PUBLIC_MAPBOX_TOKEN at
# parse time. A dummy is enough here — seed/migrate/tests never call Mapbox.
# Keep the real token required in lib/env.ts for production/runtime.
env:
  NEXT_PUBLIC_MAPBOX_TOKEN: test-mapbox-token

jobs:
  # ---------------------------------------------------------------
  # Secret scan first — cheap, and a leak makes everything else moot.
  # Complements GitHub push protection at the platform layer.
  # ---------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history for a meaningful scan
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # Everything that can run on Linux runs on Linux. Fast and cheap.
  # ---------------------------------------------------------------
  web:
    name: Web (typecheck, lint, unit, preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Pure helper tests for the preview-smoke suite (e2e/preview/lib/*.test.ts).
      # No database, no Playwright, no preview URL — just vitest.
      - run: npm run test:preview

  # ---------------------------------------------------------------
  # API contract: docs/api-spec/valgate-api-v1.yaml is the single source
  # of truth for the web route handlers AND the iOS client. If the spec
  # changes without regenerating lib/api/v1/generated-types.ts (or the
  # generated file is hand-edited), the two drift silently and iOS starts
  # decoding shapes the server no longer sends. This job is the tripwire:
  # it regenerates to a temp file and diffs, failing on any difference.
  # No database, no network — pure spec → types generation.
  # ---------------------------------------------------------------
  api-contract:
    name: API contract (spec ↔ generated TS types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - run: npm ci
      - run: npm run api:check-ts

  # Live-DB integration tests (*.db.test.ts), including the org-scoping IDOR suite.
  # This is a blocking job on purpose. Do not fold it into `e2e` — that job is
  # continue-on-error until TM1-62, which would make IDOR regressions invisible again.
  # Postgres service + migrate/seed match the e2e job; DATABASE_URL is the local
  # container, not a GitHub secret (same as e2e).
  db:
    name: DB integration (test:db)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # User is explicit (`postgres`), not the runner's OS user (`root`).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - run: npm ci

      # vitest.config.db.ts no-ops when DATABASE_URL is missing (passWithNoTests).
      # Fail loudly here so a misconfigured job cannot report green with 0 tests.
      - name: Require DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set; test:db would skip and hide IDOR regressions."
            exit 1
          fi

      - name: Migrate and seed
        run: npm run db:migrate && npm run seed:neon

      # --passWithNoTests=false is a second tripwire: even with DATABASE_URL set,
      # an empty glob must not exit 0.
      - name: Run live-DB tests
        run: npm run test:db -- --passWithNoTests=false

  appcore:
    name: AppCore (Swift on Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      # Includes swift-snapshot-testing .dump/.json assertions, which
      # run fine on Linux. Only image snapshots need a simulator.
      - name: Check for AppCore
        id: appcore-check
        run: |
          if [[ -d "ios/Packages/AppCore" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ios/Packages/AppCore not found — skipping AppCore job"
          fi
      - name: Build and test
        if: steps.appcore-check.outputs.exists == 'true'
        working-directory: ios/Packages/AppCore
        run: |
          swift build
          swift test

  e2e:
    name: E2E + visual regression
    runs-on: ubuntu-latest
    needs: web
    # TEMPORARY (TM1-62): this job has never actually run — it was always skipped
    # behind the failing `web` job, and it still can't pass without Clerk test users
    # in the job env. Left non-blocking so the pipeline reports honestly on what
    # IS enforced (secret scan, typecheck, lint, unit tests, test:db, test:preview)
    # instead of sitting permanently red — a red-by-default pipeline is exactly how
    # 8 consecutive failures went unnoticed for three weeks.
    # Remove this line the moment TM1-62 lands; it must go back to blocking.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # User is explicit (`postgres`), not the runner's OS user (`root`).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      # Dummy token for CI — t3-env validation requires it but Mapbox isn't exercised in E2E
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - run: npm ci

      # Pin the browser build. Screenshot baselines are sensitive to
      # renderer version — an unpinned upgrade produces diffs that look
      # like regressions but aren't.
      - run: npx playwright install --with-deps chromium

      - name: Migrate and seed
        run: npm run db:migrate && npm run seed:neon

      # Production build. Baselines must be captured against the same
      # thing CI runs, or every screenshot assertion drifts.
      - run: npm run build
      - run: npx playwright test

      # The report contains the actual/expected/diff triptych — this is
      # how a visual failure gets reviewed on a phone.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------
  # iOS build/test is deliberately NOT here.
  #
  # This job was removed 2026-09-18. It could never do anything:
  #   1. There is no `ios/` directory in this repo (no .xcodeproj
  #      anywhere), so its `ios-check` step always set exists=false
  #      and every subsequent step was skipped.
  #   2. It requested `[self-hosted, macOS, xcode]`, and this repo's
  #      runner (`mintrose-ios-runner`) is OFFLINE here — it is only
  #      online for `L0vU3000/valgate-ios`.
  #   3. Its build step ended in `| xcpretty || true`, so even had it
  #      run, the gate could not fail.
  #
  # Net effect was a no-op that sat `queued` for the full 45-minute
  # timeout, held the whole run `in_progress`, and thereby blocked
  # `gh run view --log-failed` on that run. The iOS project lives in
  # its own repo with its own working CI — see valgate-ios.
  # ---------------------------------------------------------------
